worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 128; }
http {
 include /etc/nginx/mime.types;
 default_type application/octet-stream;
 access_log off;
 server_tokens off;
 client_body_temp_path /tmp/client_body;
 proxy_temp_path /tmp/proxy;
 fastcgi_temp_path /tmp/fastcgi;
 uwsgi_temp_path /tmp/uwsgi;
 scgi_temp_path /tmp/scgi;
 client_max_body_size 1m;
 server {
  listen 8080;
  root /usr/share/nginx/html;
  add_header Cache-Control no-store always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header X-Frame-Options DENY always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' blob: data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
  location /api/ {
   proxy_pass http://127.0.0.1:14904;
   proxy_set_header Host $http_host;
   proxy_set_header Cf-Access-Jwt-Assertion $http_cf_access_jwt_assertion;
   proxy_set_header Origin $http_origin;
   proxy_buffering off;
   proxy_read_timeout 1h;

  }
  location / { try_files $uri $uri/ /index.html; }
 }
}
